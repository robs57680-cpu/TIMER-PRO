<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11130f">
<title>Pulse — Workout Timer</title>
<style>
:root{color-scheme:dark;--bg:#11130f;--panel:#1b1e18;--panel2:#242820;--text:#f4f6ef;--muted:#a4ab9b;--lime:#c7f36b;--orange:#ffb45d;--blue:#83c9ff;--border:#343a2e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252c1b 0%,var(--bg) 50%);color:var(--text);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}select option{background:#20241d;color:var(--text)}button{cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font-weight:750;transition:transform .12s,opacity .12s}button:active{transform:scale(.98)}button:disabled{opacity:.35;cursor:not-allowed}
.app{max-width:1050px;margin:auto;padding:24px 18px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;background:var(--lime);color:#15190f;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:1000}.brand h1{font-size:20px;letter-spacing:-.6px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px;letter-spacing:1.4px;text-transform:uppercase}.pill{border:1px solid var(--border);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:18px}.card{background:linear-gradient(145deg,rgba(31,35,27,.96),rgba(22,25,20,.98));border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 18px 50px #0002}.section-title{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:var(--panel2);border:1px solid #343a2e;border-radius:16px;padding:12px 13px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}.stepper input{width:72px;min-width:0;background:transparent;color:var(--text);border:0;outline:0;font-size:24px;font-weight:800;text-align:center}.stepper button{padding:3px 10px;background:#353b2d;color:var(--lime);font-size:20px;border-radius:10px}.toggles{display:grid;gap:10px;margin:16px 0}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#20241d;border-radius:14px;color:#dfe4d7;font-size:14px}.toggle input{accent-color:var(--lime);width:19px;height:19px}.primary{background:var(--lime);color:#171b10}.secondary{background:#30372a;color:var(--text);border:1px solid #414a36}.quiet{background:transparent;color:var(--muted);border:1px solid var(--border)}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.timer-card{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:420px}.timer-head{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.timer-head .section-title{margin:0}.phase{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:1.5px;font-weight:900;border-radius:999px;padding:8px 12px;background:#2b3820;color:var(--lime)}.phase.rest{background:#203241;color:var(--blue)}.phase.done{background:#3a3022;color:var(--orange)}.ring{width:min(68vw,280px);height:min(68vw,280px);max-width:280px;max-height:280px;position:relative;display:grid;place-items:center;margin:8px auto 18px}.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:7}.track{stroke:#30362a}.progress{stroke:var(--lime);stroke-linecap:round;transition:stroke-dashoffset .25s linear}.rest-ring .progress{stroke:var(--blue)}.time{font-size:clamp(42px,9vw,66px);letter-spacing:-3px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}.phase-caption{color:var(--muted);font-size:13px;margin-top:10px}.rounds{display:flex;gap:6px;justify-content:center;margin:0 0 18px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:50%;background:#454c3b}.dot.done{background:var(--lime)}.dot.current{background:var(--text);outline:3px solid #c7f36b44}.next{display:flex;justify-content:space-between;width:100%;padding:12px 14px;background:#20241d;border-radius:14px;color:var(--muted);font-size:13px;margin-bottom:16px}.next strong{color:var(--text)}.saved{margin-top:18px}.saved-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.saved-head .section-title{margin:0}.saved-list{display:grid;gap:9px;margin-top:14px}.saved-item{display:flex;align-items:center;gap:12px;padding:13px;background:#20241d;border:1px solid #30372a;border-radius:15px}.saved-item .info{flex:1;min-width:0}.saved-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-item small{color:var(--muted)}.saved-item button{padding:9px 11px}.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--border);border-radius:15px}.foot{color:#777f70;text-align:center;font-size:12px;margin-top:20px}.status{color:var(--muted);font-size:12px;min-height:18px;margin-top:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.app{padding:18px 12px 32px}.card{padding:18px}.timer-card{min-height:0}.ring{width:250px;height:250px}.top{margin-bottom:16px}}

@media (orientation:landscape) and (max-height:600px){
 .app{max-width:none;padding:8px 14px 12px}.top{margin-bottom:8px}.brand .logo{width:34px;height:34px}
 .timer-card{min-height:0;padding:10px 18px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;align-items:center;gap:8px}
 .timer-head{grid-column:1/-1;margin:0}.ring{width:min(48vh,220px);height:min(48vh,220px);margin:0 auto;grid-column:2;grid-row:2}.time{font-size:clamp(38px,8vh,58px)}
 .rounds,.next,.timer-card > .actions,#timerStatus{grid-column:1/-1}.rounds{margin:0}.next{margin:0}.timer-card > .actions{max-width:700px;width:100%;margin:0 auto}#timerStatus{margin:0}
}

</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">ϟ</div><div><h1>PULSE</h1><p>Workout timer</p></div></div><div class="pill">INTERVAL TRAINING</div></header>
<main class="layout" id="setupPage">
<section>
<div class="card">
<h2 class="section-title">Configurer la séance</h2>
<div class="field" style="margin-bottom:12px"><label for="mode">Mode de chronométrage</label><select id="mode" style="width:100%;background:transparent;color:var(--text);border:0;font-size:16px;font-weight:750;padding:5px 0;outline:0"><option value="hiit">HIIT · Effort / repos / rounds</option><option value="stopwatch">Chronomètre · Temps montant</option></select></div>
<div id="hiitSettings"><div class="field" style="margin-bottom:12px"><label for="workoutName">Nom de l'entraînement</label><input id="workoutName" value="HIIT Circuit" maxlength="50" style="width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;font-weight:750"></div>
<div class="fields">
<div class="field"><label for="work">Effort (secondes)</label><div class="stepper"><button data-step="work" data-delta="-5" aria-label="Diminuer effort">−</button><input id="work" type="number" min="1" max="3600" value="30"><button data-step="work" data-delta="5" aria-label="Augmenter effort">+</button></div></div>
<div class="field"><label for="rest">Repos (secondes)</label><div class="stepper"><button data-step="rest" data-delta="-5" aria-label="Diminuer repos">−</button><input id="rest" type="number" min="0" max="3600" value="15"><button data-step="rest" data-delta="5" aria-label="Augmenter repos">+</button></div></div>
<div class="field"><label for="rounds">Rounds</label><div class="stepper"><button data-step="rounds" data-delta="-1" aria-label="Diminuer rounds">−</button><input id="rounds" type="number" min="1" max="99" value="8"><button data-step="rounds" data-delta="1" aria-label="Augmenter rounds">+</button></div></div>
<div class="field"><label for="cycles">Cycles</label><div class="stepper"><button data-step="cycles" data-delta="-1" aria-label="Diminuer cycles">−</button><input id="cycles" type="number" min="1" max="20" value="1"><button data-step="cycles" data-delta="1" aria-label="Augmenter cycles">+</button></div></div>
<div class="field"><label for="warmup">Échauffement (secondes)</label><div class="stepper"><button data-step="warmup" data-delta="-5" aria-label="Diminuer échauffement">−</button><input id="warmup" type="number" min="0" max="3600" value="0"><button data-step="warmup" data-delta="5" aria-label="Augmenter échauffement">+</button></div></div>
<div class="field"><label for="cooldown">Retour au calme (secondes)</label><div class="stepper"><button data-step="cooldown" data-delta="-5" aria-label="Diminuer retour au calme">−</button><input id="cooldown" type="number" min="0" max="3600" value="0"><button data-step="cooldown" data-delta="5" aria-label="Augmenter retour au calme">+</button></div></div>
</div>
</div>
<div class="toggles">
<label class="toggle"><span>Guidage vocal</span><input type="checkbox" id="voice" checked></label>
<label class="toggle"><span>Bips de transition</span><input type="checkbox" id="beeps" checked></label>
</div>
<div class="actions"><button class="primary" id="start">▶ Démarrer</button><button class="secondary" id="save">＋ Enregistrer</button></div>
<div class="status" id="status" role="status"></div>
</div>
<div class="card saved">
<div class="saved-head"><h2 class="section-title">Mes entraînements</h2><button class="quiet" id="clearSaved" style="padding:8px 10px;font-size:12px">Tout effacer</button></div>
<div class="saved-list" id="savedList"></div>
</div>
</section>
<section class="card timer-card" id="timerPage" style="display:none;grid-column:1/-1;min-height:calc(100dvh - 150px)">
<div class="timer-head"><button class="quiet" id="backSetup">← Paramètres</button><h2 class="section-title">En cours</h2><span id="phase" class="phase">PRÊT</span><button class="secondary" id="landscapeBtn" title="Plein écran / paysage">⛶ Paysage</button></div>
<div class="ring" id="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"></circle><circle class="progress" id="progress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"></circle></svg><div><div class="time" id="time">00:30</div><div class="phase-caption" id="caption">Prêt quand tu l'es</div></div></div>
<div class="rounds" id="roundDots"></div>
<div class="next"><span>Prochaine étape</span><strong id="nextText">Effort · 00:30</strong></div>
<div class="actions"><button class="primary" id="pause" disabled>Ⅱ Pause</button><button class="secondary" id="skip" disabled>Passer ⏭</button><button class="quiet" id="reset">↺ Réinitialiser</button></div>
<div class="status" id="timerStatus">Configure ta séance puis démarre.</div>
</section>
</main>
<p class="foot">PULSE · Minuteur d'intervalles · Tes séances sont enregistrées localement sur cet appareil.</p>
</div>
<script>
(()=> {
const $=id=>document.getElementById(id);
const ids=['work','rest','rounds','cycles','warmup','cooldown'];
let timer=null, running=false, paused=false, remaining=30, phaseIndex=0, phases=[], phaseStart=30, roundNow=1, cycleNow=1, started=false, endAt=0, audioCtx=null, stopwatchElapsed=0, stopwatchStartedAt=0;
const CIRC=276.46;
function num(id,min=0,max=9999){const el=$(id);let n=Number.parseInt(el.value,10);if(!Number.isFinite(n))n=min;n=Math.max(min,Math.min(max,n));el.value=n;return n}
function config(){return {mode:$('mode').value,name:$('workoutName').value.trim()||'Entraînement',work:num('work',1,3600),rest:num('rest',0,3600),rounds:num('rounds',1,99),cycles:num('cycles',1,20),warmup:num('warmup',0,3600),cooldown:num('cooldown',0,3600),voice:$('voice').checked,beeps:$('beeps').checked}}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setStatus(s){$('status').textContent=s}
function buildPhases(c){const a=[];if(c.warmup)a.push({type:'warmup',duration:c.warmup,label:'ÉCHAUFFEMENT'});for(let cy=1;cy<=c.cycles;cy++){for(let r=1;r<=c.rounds;r++){a.push({type:'work',duration:c.work,label:'EFFORT',round:r,cycle:cy});if(c.rest>0 && (r<c.rounds || cy<c.cycles))a.push({type:'rest',duration:c.rest,label:'REPOS',round:r,cycle:cy})}}if(c.cooldown)a.push({type:'cooldown',duration:c.cooldown,label:'RETOUR AU CALME'});return a}
function speak(text){if(!$('voice').checked||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
function beep(freq=740,duration=.12){if(!$('beeps').checked)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.13,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration+.02)}catch(e){}}
function renderDots(){const c=config(),total=c.rounds*c.cycles;$('roundDots').innerHTML='';for(let i=1;i<=Math.min(total,30);i++){const d=document.createElement('span');d.className='dot'+(i<=(cycleNow-1)*c.rounds+roundNow-1?' done':'')+(i===(cycleNow-1)*c.rounds+roundNow?' current':'');d.title='Round '+i; $('roundDots').appendChild(d)}if(total>30){const s=document.createElement('small');s.textContent='+'+(total-30);s.style.color='var(--muted)';$('roundDots').appendChild(s)}}
function render(){const c=config();if(c.mode==='stopwatch'){const elapsed=running&&!paused?stopwatchElapsed+(Date.now()-stopwatchStartedAt)/1000:stopwatchElapsed;$('time').textContent=fmt(elapsed);$('progress').style.strokeDashoffset=String(CIRC*(1-(elapsed%60)/60));$('phase').textContent=started?(paused?'EN PAUSE':'CHRONOMÈTRE'):'CHRONOMÈTRE';$('phase').className='phase';$('ring').classList.remove('rest-ring');$('caption').textContent='Temps écoulé';$('roundDots').innerHTML='';$('nextText').textContent='Chronomètre sans limite';$('pause').disabled=!started||!running;$('pause').textContent=paused?'▶ Reprendre':'Ⅱ Pause';$('skip').disabled=true;return}const p=phases[phaseIndex];$('time').textContent=fmt(remaining);$('progress').style.strokeDashoffset=String(CIRC*(1-(phaseStart?remaining/phaseStart:0)));$('phase').textContent=p?p.label:'PRÊT';$('phase').className='phase'+(p&&p.type==='rest'?' rest':'')+(p&&['cooldown'].includes(p.type)?' done':'');$('ring').classList.toggle('rest-ring',!!p&&p.type==='rest');$('caption').textContent=p?(p.type==='work'?'Donne tout ce que tu as':p.type==='rest'?'Respire et récupère':p.type==='warmup'?'Prépare-toi':'Séance presque terminée'):'Prêt quand tu l’es';$('nextText').textContent=p?`${p.label.toLowerCase()} · ${fmt(remaining)}`:`Effort · ${fmt(c.work)}`;$('pause').disabled=!started||!running;$('pause').textContent=paused?'▶ Reprendre':'Ⅱ Pause';$('skip').disabled=!started||!running;renderDots()}
function enterPhase(i){phaseIndex=i;if(i>=phases.length){finish();return}const p=phases[i];remaining=p.duration;phaseStart=p.duration;roundNow=p.round||roundNow;cycleNow=p.cycle||cycleNow;render();if(p.type==='work')speak('Effort. Round '+(p.round||roundNow));else if(p.type==='rest')speak('Repos');else if(p.type==='warmup')speak('Échauffement');else speak('Retour au calme');beep(p.type==='rest'?520:850)}
function tick(){if(!running||paused)return;if(config().mode==='stopwatch'){render();return}const now=Date.now();remaining=Math.max(0,(endAt-now)/1000);if(remaining<=0){if(phaseIndex+1>=phases.length){finish();return}enterPhase(phaseIndex+1);endAt=Date.now()+remaining*1000;endAt=Date.now()+phases[phaseIndex].duration*1000;remaining=phases[phaseIndex].duration}if(remaining<=3&&remaining>0&&Math.ceil(remaining)!==Math.ceil(remaining+0.2))beep(650,.06);render()}
function finish(){clearInterval(timer);timer=null;running=false;paused=false;started=false;remaining=0;phaseIndex=phases.length;render();$('phase').textContent='TERMINÉ';$('phase').className='phase done';$('caption').textContent='Bravo, séance terminée !';$('timerStatus').textContent='Entraînement terminé.';speak('Bravo ! Entraînement terminé.');beep(900,.3);setTimeout(()=>beep(1100,.3),220)}
function start(){if(running&&!paused)return;const c=config();if(c.mode==='stopwatch'){if(!started){started=true;running=true;paused=false;stopwatchElapsed=0;stopwatchStartedAt=Date.now();timer=setInterval(tick,100);showTimerPage();$('timerStatus').textContent='Chronomètre en cours.';speak('Chronomètre démarré');render()}else if(paused){paused=false;running=true;stopwatchStartedAt=Date.now();timer=setInterval(tick,100);render();$('timerStatus').textContent='Chronomètre en cours.'}return}if(!started){showTimerPage();phases=buildPhases(c);phaseIndex=0;roundNow=1;cycleNow=1;started=true;if(!phases.length)return;remaining=phases[0].duration;phaseStart=remaining;running=true;paused=false;endAt=Date.now()+remaining*1000;render();speak('On commence.');enterPhase(0);endAt=Date.now()+phases[0].duration*1000;$('timerStatus').textContent=c.name+' · '+(c.rounds*c.cycles)+' rounds';timer=setInterval(tick,100)}else if(paused){paused=false;running=true;endAt=Date.now()+remaining*1000;timer=setInterval(tick,100);render()}}
function pause(){if(!started||!running)return;if(!paused){if(config().mode==='stopwatch')stopwatchElapsed+=(Date.now()-stopwatchStartedAt)/1000;paused=true;clearInterval(timer);timer=null;if(config().mode==='stopwatch'){render();$('timerStatus').textContent='Chronomètre en pause.';return}remaining=Math.max(0,(endAt-Date.now())/1000);render();$('timerStatus').textContent='En pause.';speak('Pause')}else{paused=false;endAt=Date.now()+remaining*1000;timer=setInterval(tick,100);render();$('timerStatus').textContent='Séance en cours.';speak('On reprend')}}
function skip(){if(config().mode==='stopwatch'||!started||!running)return;if(phaseIndex+1>=phases.length){finish();return}enterPhase(phaseIndex+1);endAt=Date.now()+remaining*1000}
function reset(){clearInterval(timer);timer=null;running=false;paused=false;started=false;stopwatchElapsed=0;stopwatchStartedAt=0;phases=[];phaseIndex=0;const c=config();remaining=c.warmup||c.work;phaseStart=remaining;roundNow=1;cycleNow=1;render();$('timerStatus').textContent='Prêt à démarrer.';speak('')}
function save(){const c=config();if(c.mode==='stopwatch'){setStatus('Le chronomètre libre ne nécessite pas de séance enregistrée.');return}let items=[];try{items=JSON.parse(localStorage.getItem('pulseWorkouts')||'[]')}catch(e){}const item={...c,id:Date.now()};items.unshift(item);items=items.slice(0,50);try{localStorage.setItem('pulseWorkouts',JSON.stringify(items));drawSaved();setStatus('Séance enregistrée sur cet appareil.')}catch(e){setStatus('Impossible d’enregistrer : stockage indisponible.')}} 
function drawSaved(){let items=[];try{items=JSON.parse(localStorage.getItem('pulseWorkouts')||'[]')}catch(e){}const root=$('savedList');root.innerHTML='';if(!items.length){root.innerHTML='<div class="empty">Aucune séance enregistrée pour le moment.</div>';return}items.forEach(it=>{const row=document.createElement('div');row.className='saved-item';const info=document.createElement('div');info.className='info';const strong=document.createElement('strong');strong.textContent=it.name;const small=document.createElement('small');small.textContent=`${it.work}s effort · ${it.rest}s repos · ${it.rounds} rounds × ${it.cycles}`;info.append(strong,small);const load=document.createElement('button');load.className='secondary';load.textContent='Charger';load.onclick=()=>{ $('workoutName').value=it.name;for(const k of ids)$(k).value=it[k]??0;$('voice').checked=it.voice;$('beeps').checked=it.beeps;reset();setStatus('Séance « '+it.name+' » chargée.')};const del=document.createElement('button');del.className='quiet';del.textContent='×';del.setAttribute('aria-label','Supprimer '+it.name);del.onclick=()=>{const next=items.filter(x=>x.id!==it.id);localStorage.setItem('pulseWorkouts',JSON.stringify(next));drawSaved()};row.append(info,load,del);root.appendChild(row)})}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{if(started)return;const id=b.dataset.step,delta=Number(b.dataset.delta),el=$(id);el.value=Number(el.value||0)+delta;num(id,id==='work'?1:0,id==='rounds'?99:id==='cycles'?20:3600);remaining=config().warmup||config().work;phaseStart=remaining;render()}));
function showTimerPage(){$('setupPage').style.display='block';$('setupPage').querySelector(':scope > section').style.display='none';$('timerPage').style.display='flex';$('timerPage').style.flexDirection='column';$('timerPage').style.alignItems='stretch';$('timerPage').style.justifyContent='center';document.querySelector('.foot').style.display='none'}
function showSetupPage(){if(running&&!paused)pause();$('timerPage').style.display='none';$('setupPage').style.display='grid';$('setupPage').querySelector(':scope > section').style.display='block';document.querySelector('.foot').style.display='block'}
$('backSetup').onclick=showSetupPage;
$('landscapeBtn').onclick=async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');$('timerStatus').textContent='Mode paysage demandé. Si l’écran ne pivote pas, active la rotation automatique de ton appareil.'}catch(e){$('timerStatus').textContent='Affiche ton appareil en paysage et active la rotation automatique si nécessaire.'}};
$('mode').addEventListener('change',()=>{reset();const isHiit=$('mode').value==='hiit';$('hiitSettings').style.display=isHiit?'block':'none';$('save').style.display=isHiit?'':'none';$('savedList').parentElement.style.display=isHiit?'':'none';$('phase').textContent=isHiit?'PRÊT':'CHRONOMÈTRE';$('caption').textContent=isHiit?'Prêt quand tu l’es':'Temps écoulé';$('nextText').textContent=isHiit?'Effort · '+fmt(config().work):'Chronomètre sans limite';$('time').textContent=isHiit?fmt(config().work):'00:00';$('timerStatus').textContent=isHiit?'Configure ta séance puis démarre.':'Prêt à démarrer le chronomètre.'});
$('start').onclick=()=>{if(!started)start();else if(paused)start();else {setStatus('La séance est déjà en cours. Mets-la en pause pour reprendre le contrôle.')}};
$('pause').onclick=pause;$('skip').onclick=skip;$('reset').onclick=reset;$('save').onclick=save;
$('clearSaved').onclick=()=>{if(confirm('Effacer toutes les séances enregistrées sur cet appareil ?')){localStorage.removeItem('pulseWorkouts');drawSaved();setStatus('Séances effacées.')}};
ids.forEach(id=>$(id).addEventListener('change',()=>{if(!started){const c=config();remaining=c.warmup||c.work;phaseStart=remaining;render()}}));
drawSaved();remaining=config().work;phaseStart=remaining;render();$('hiitSettings').style.display='block';
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){$('timerStatus').textContent='Minuteur en cours. Selon le navigateur et le mode économie d’énergie, les alertes en arrière-plan peuvent être limitées.'}});
})();
</script>
</body>
</html>
